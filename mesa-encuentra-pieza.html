  :root{
    --graphite: #14171a;
    --graphite-2: #1f2327;
    --orange: #2f6fed;
    --ok: #3fae6a;
    --bad: #d84343;
    --text-light: #f4f5f6;
    --text-mute: #8a9098;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--graphite);
    color: var(--text-light);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 14px;
  }
  .rig{ width:100%; max-width: 900px; }

  .headtag{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom: 2px solid #3a3f45;
    padding-bottom: 12px;
    margin-bottom: 16px;
    gap: 10px;
  }
  .headtag h1{
    font-family:'Elektra Light Pro', sans-serif;
    font-weight:700;
    font-size: clamp(18px, 4.4vw, 28px);
    letter-spacing: 0.5px;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .headtag h1 span{ color: var(--orange); }
  .headtag .subline{
    font-size: 10.5px;
    color: var(--text-mute);
    letter-spacing: 1px;
    margin-top: 5px;
    text-transform: uppercase;
  }
  .scorebox{
    text-align:right;
    font-size: 10.5px;
    color: var(--text-mute);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .scorebox .num{
    font-family:'Elektra Light Pro', sans-serif;
    font-size: 26px;
    color: var(--text-light);
    font-weight: 600;
  }
  .lives{ display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }
  .life-dot{ width:9px; height:9px; background: var(--orange); transform: rotate(45deg); }
  .life-dot.lost{ background: var(--graphite-2); border:1px solid #3a3f45; }

  .instruction{
    background: var(--graphite-2);
    border: 1px solid #2c3136;
    border-left: 4px solid var(--orange);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .instruction .tag{
    font-size: 9.5px;
    color: var(--text-mute);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .instruction .target{
    font-family:'Elektra Light Pro', sans-serif;
    font-size: clamp(16px, 4vw, 23px);
    font-weight:600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }

  .stage{
    position: relative;
    width: 100%;
    line-height: 0;
    border: 1px solid #3a3f45;
    border-radius: 3px;
    overflow: hidden;
    background: #000;
  }
  .stage img{
    display:block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }

  .hotspot{
    position:absolute;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  .hotspot .dot{
    position:absolute;
    top:50%; left:50%;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(47, 111, 237, 0.55);
    border: 1.5px solid rgba(255,255,255,0.85);
    transform: translate(-50%,-50%);
    box-shadow: 0 0 0 4px rgba(24, 58, 138, 0.18);
    animation: breathe 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:0.55; }
    50%{ opacity:1; }
  }

  .hotspot.correct .dot{
    background: var(--ok);
    border-color: #fff;
    box-shadow: 0 0 0 10px rgba(63,174,106,0.25);
    animation: none;
  }
  .hotspot.wrong .dot{
    background: var(--bad);
    border-color: #fff;
    box-shadow: 0 0 0 10px rgba(216,67,67,0.25);
    animation: none;
  }
  .hotspot.reveal .dot{
    background: var(--ok);
    border-color: #fff;
    box-shadow: 0 0 0 10px rgba(63,174,106,0.3);
    animation: none;
  }
  .hotspot.disabled{ pointer-events:none; }

  .feedback{
    margin-top: 12px;
    min-height: 20px;
    font-size: 11.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-align:center;
  }
  .feedback.ok{ color: var(--ok); }
  .feedback.bad{ color: var(--bad); }

  .endcard{
    background: var(--graphite-2);
    border: 1px solid #2c3136;
    border-top: 4px solid var(--orange);
    padding: 30px 20px;
    text-align:center;
  }
  .endcard h2{
    font-family:'Elektra Light Pro', sans-serif;
    text-transform: uppercase;
    font-size: 22px;
    margin-bottom: 6px;
  }
  .endcard .res{
    font-family:'Elektra Light Pro', sans-serif;
    font-size: 42px;
    color: var(--orange);
    margin: 12px 0 6px;
  }
  .endcard p{ font-size: 10.5px; color: var(--text-mute); letter-spacing: 1px; text-transform: uppercase; }
  .btn{
    margin-top: 20px;
    background: var(--orange);
    color: #14171a;
    border: none;
    font-family:'Elektra Light Pro', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 13px;
    padding: 11px 24px;
    cursor: pointer;
    border-radius: 2px;
  }

    <div class="feedback" id="feedback"></div>
  </div>

  <div id="end" class="endcard hidden">
    <h2>Turno terminado</h2>
    <div class="res" id="finalScore">0</div>
    <p>Piezas identificadas correctamente</p>
    <button class="btn" id="restartBtn">Volver a intentarlo</button>
  </div>

</div>

<script>
/* ---------- ZONAS SOBRE LA FOTO (en % del ancho/alto de la imagen) ---------- */
/* Cada pieza es un rectángulo left/top/width/height en %. Ajusta estos números
   si alguna zona no coincide exactamente con la pieza real en tu foto. */
const HOTSPOTS = [
  { key: "cuchilla",           label: "Cuchilla",                         x: 40, y: 16.5, w: 35, h: 7   },
  { key: "resistencias",       label: "Resistencias (pletinas de nicrom)",x: 38, y: 23.5, w: 37, h: 6.5 },
  { key: "tiras_epoxiglas",    label: "Tiras aislantes de epoxiglas",     x: 42, y: 29,   w: 29, h: 5   },
  { key: "cuerpo_aluminio",    label: "Cuerpo de aluminio",               x: 43, y: 35,   w: 29, h: 12  },
  { key: "piezas_bronce",      label: "Piezas de bronce",                 x: 38, y: 49,   w: 8,  h: 9   },
  { key: "ejes_plastico",      label: "Ejes de plástico",                 x: 62, y: 56,   w: 7,  h: 5  },
  { key: "soportes_aislantes", label: "Soportes aislantes + muelles",     x: 68, y: 62,   w: 9,  h: 15  },
  { key: "muelles_retroceso",  label: "Muelles de retroceso",             x: 43, y: 71.5, w: 9,  h: 16  },
  { key: "piezas_deslizantes", label: "Piezas deslizantes",               x: 77, y: 74.5, w: 7,  h: 8   }
];

const TOTAL_ROUNDS = 9;
const MAX_LIVES = 3;

let score = 0;
let lives = MAX_LIVES;
let round = 0;
let currentTarget = null;
let locked = false;
let usedThisGame = [];

const stageEl = document.getElementById('stage');
const targetLabelEl = document.getElementById('targetLabel');
const scoreNumEl = document.getElementById('scoreNum');
const livesEl = document.getElementById('lives');
const feedbackEl = document.getElementById('feedback');
const gameEl = document.getElementById('game');
const endEl = document.getElementById('end');
const finalScoreEl = document.getElementById('finalScore');

function renderLives(){
  livesEl.innerHTML = '';
  for(let i = 0; i < MAX_LIVES; i++){
    const d = document.createElement('div');
    d.className = 'life-dot' + (i >= lives ? ' lost' : '');
    livesEl.appendChild(d);
  }
}

function buildHotspots(){
  // elimina hotspots previos (deja solo la imagen)
  [...stageEl.querySelectorAll('.hotspot')].forEach(el => el.remove());

  HOTSPOTS.forEach(spot => {
    const btn = document.createElement('button');
    btn.className = 'hotspot';
    btn.style.left = spot.x + '%';
    btn.style.top = spot.y + '%';
    btn.style.width = spot.w + '%';
    btn.style.height = spot.h + '%';
    btn.dataset.key = spot.key;
    btn.setAttribute('aria-label', spot.label);
    btn.innerHTML = '<span class="dot"></span>';
    btn.addEventListener('click', () => handlePick(btn, spot.key));
    stageEl.appendChild(btn);
  });
}

function pickTarget(){
  let pool = HOTSPOTS.filter(s => !usedThisGame.includes(s.key));
  if(pool.length === 0){
    usedThisGame = [];
    pool = HOTSPOTS;
  }
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  usedThisGame.push(chosen.key);
  return chosen;
}

function newRound(){
  if(round >= TOTAL_ROUNDS || lives <= 0){
    endGame();
    return;
  }
  round++;
  locked = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';

  const allSpots = [...stageEl.querySelectorAll('.hotspot')];
  allSpots.forEach(el => el.classList.remove('correct', 'wrong', 'reveal', 'disabled'));

  currentTarget = pickTarget();
  targetLabelEl.textContent = currentTarget.label;
}

function handlePick(btn, key){
  if(locked) return;
  locked = true;

  const allSpots = [...stageEl.querySelectorAll('.hotspot')];
  allSpots.forEach(el => el.classList.add('disabled'));

  if(key === currentTarget.key){
    score++;
    scoreNumEl.textContent = score;
    btn.classList.remove('disabled');
    btn.classList.add('correct');
    feedbackEl.textContent = 'Correcto · pieza identificada';
    feedbackEl.classList.add('ok');
  } else {
    lives--;
    renderLives();
    btn.classList.remove('disabled');
    btn.classList.add('wrong');
    const correctBtn = allSpots.find(el => el.dataset.key === currentTarget.key);
    if(correctBtn) correctBtn.classList.add('reveal');
    feedbackEl.textContent = 'Incorrecto · esa no es la pieza pedida';
    feedbackEl.classList.add('bad');
  }

  setTimeout(newRound, 950);
}

function endGame(){
  gameEl.classList.add('hidden');
  endEl.classList.remove('hidden');
  finalScoreEl.textContent = score + ' / ' + TOTAL_ROUNDS;
}

function startGame(){
  score = 0;
  lives = MAX_LIVES;
  round = 0;
  usedThisGame = [];
  scoreNumEl.textContent = '0';
  renderLives();
  gameEl.classList.remove('hidden');
  endEl.classList.add('hidden');
  buildHotspots();
  newRound();
}

document.getElementById('restartBtn').addEventListener('click', startGame);

startGame();
</script>
